name: Assign Build Number

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

concurrency:
  group: build-number
  cancel-in-progress: false

jobs:
  build-number:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get next build number
        id: build
        shell: bash
        run: |
          git fetch origin main

          current=$(git show origin/main:BUILD)

          if ! [[ "$current" =~ ^[0-9]+$ ]]; then
            echo "ERROR: main/BUILD no contiene un número válido."
            exit 1
          fi

          next=$((current + 1))

          echo "BUILD actual : $current"
          echo "BUILD nuevo  : $next"

          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Update BUILD in main
        shell: bash
        run: |
          git fetch origin main
          git checkout --detach origin/main

          next="${{ steps.build.outputs.next }}"

          echo "$next" > BUILD

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add BUILD
          git commit -m "[BUILD] $next"

          git push origin HEAD:main

      - name: Create build tag
        shell: bash
        run: |
          next="${{ steps.build.outputs.next }}"

          git tag "$next" "$GITHUB_SHA"

          git push origin "$next"

      - name: Build result
        run: |
          echo "======================================"
          echo "BUILD : ${{ steps.build.outputs.next }}"
          echo "BRANCH: ${{ github.ref_name }}"
          echo "COMMIT: $GITHUB_SHA"
          echo "======================================"
